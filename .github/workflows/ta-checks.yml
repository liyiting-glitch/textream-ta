name: TA Assistant checks

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Textream/**'
      - 'TARegressionTests.swift'
      - 'TALectureRegressionTests.swift'
      - '.github/workflows/ta-checks.yml'
  pull_request:
    paths:
      - 'Textream/**'
      - 'TARegressionTests.swift'
      - 'TALectureRegressionTests.swift'
      - '.github/workflows/ta-checks.yml'

permissions:
  contents: read

concurrency:
  group: ta-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: TA regression checks (mock services)
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -default-isolation MainActor \
            -target "$(uname -m)-apple-macosx15.0" \
            Textream/Textream/TA*.swift TARegressionTests.swift \
            -o "$RUNNER_TEMP/ta-regression-tests"
          "$RUNNER_TEMP/ta-regression-tests" | tee ta-tests.log

      - name: Lecture interruption checks (mock reader)
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -default-isolation MainActor \
            -target "$(uname -m)-apple-macosx15.0" \
            Textream/Textream/TALectureSession.swift TALectureRegressionTests.swift \
            -o "$RUNNER_TEMP/ta-lecture-tests"
          "$RUNNER_TEMP/ta-lecture-tests" | tee ta-lecture-tests.log

      - name: Build complete macOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Textream/Textream.xcodeproj \
            -scheme Textream -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TextreamBuild" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ta-build.log

      - name: Package unsigned test build
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/TextreamBuild/Build/Products/Release/Textream TA.app" \
            Textream-TA-unsigned.zip
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, subprocess
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'TextreamBuild/Build/Products/Release/Textream TA.app'
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'com.liyitingglitch.textream.ta'
          assert info['CFBundleName'] == 'Textream TA'
          executable = app / 'Contents/MacOS' / info['CFBundleExecutable']
          manifest = {
              'source_commit': os.environ['GITHUB_SHA'],
              'ci_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'bundle_identifier': info['CFBundleIdentifier'],
              'app_name': info['CFBundleName'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'architectures': subprocess.check_output(['lipo', '-archs', str(executable)], text=True).strip().split(),
              'executable_sha256': hashlib.sha256(executable.read_bytes()).hexdigest(),
              'unsigned_zip_sha256': hashlib.sha256(pathlib.Path('Textream-TA-unsigned.zip').read_bytes()).hexdigest()
          }
          pathlib.Path('Textream-TA-build.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Textream-TA-unsigned
          path: |
            Textream-TA-unsigned.zip
            Textream-TA-build.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TA-validation-logs
          path: |
            ta-tests.log
            ta-lecture-tests.log
            ta-build.log
          retention-days: 7
          if-no-files-found: ignore
